on: [push, pull_request, workflow_dispatch]

name: Build

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        board: [adv360_left, adv360_right]
    name: Build (${{ matrix.board }})
    steps:
      - name: Bootstrap node via mise
        run: |
          set -eu
          apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git
          curl -fsSL https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          mise use -g node@lts
          ln -sf "$(mise which node)" /usr/local/bin/node
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.local/share/mise/shims" >> $GITHUB_PATH
          node --version
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
      - name: Get version data
        id: get_info
        run: |
          timestamp=$(date +"%Y%m%d%H%M")
          commit=$(echo "${{ github.sha }}" | cut -c1-7)
          file_prefix=$timestamp-$commit
          branch_name=$(echo "${{ github.ref }}" | awk -F'/' '{print $3}' | cut -c1-4)
          side=$(echo "${{ matrix.board }}" | awk -F'_' '{print $2}')
          echo "file_prefix=$file_prefix" >> $GITHUB_OUTPUT
          echo "side=$side" >> $GITHUB_OUTPUT
          bin/get_version.sh $branch_name $commit
      - name: Cache west modules
        uses: https://code.forgejo.org/actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('manifest-dir/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: West Init
        run: west init -l config
      - name: West Update
        run: west update
      - name: West Zephyr export
        run: west zephyr-export
      - name: West Build
        run: west build -s zmk/app -d build -b ${{ matrix.board }} -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
      - name: Kconfig file
        run: grep -vE '(^#|^$)' build/zephyr/.config
      - name: Rename zmk.uf2
        run: cp build/zephyr/zmk.uf2 ${{ steps.get_info.outputs.file_prefix }}-${{ steps.get_info.outputs.side }}.uf2
      - name: Archive
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: firmware-${{ steps.get_info.outputs.side }}
          path: ${{ steps.get_info.outputs.file_prefix }}-${{ steps.get_info.outputs.side }}.uf2
